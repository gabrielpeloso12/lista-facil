<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 216 216">
  <!-- list card (sits behind the cart rim, sticks up above it) -->
  <rect x="63" y="12" width="74" height="118" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="8"/>

  <!-- checkmark on first item -->
  <path d="M74 46 L83 55 L97 35" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- list lines -->
  <line x1="106" y1="45" x2="127" y2="45" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
  <line x1="74" y1="70" x2="127" y2="70" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
  <line x1="74" y1="90" x2="115" y2="90" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

  <!-- cart handle -->
  <path d="M28 102 L14 84 L4 84" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cart basket -->
  <path d="M28 102 L172 102 L142 168 L58 168 Z" fill="none" stroke="#0F172A" stroke-width="10" stroke-linejoin="round"/>

  <!-- axles -->
  <line x1="60" y1="168" x2="72" y2="182" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
  <line x1="140" y1="168" x2="128" y2="182" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>

  <!-- wheels -->
  <circle cx="73" cy="184" r="13" fill="#0F172A"/>
  <circle cx="127" cy="184" r="13" fill="#0F172A"/>
</svg>
